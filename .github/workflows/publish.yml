name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Verify tag matches package version
        run: |
          node -e "const p=require('./package.json');const t=(process.env.GITHUB_REF_NAME||'').replace(/^v/,'');if(p.version!==t){console.error('tag v'+t+' does not match package version '+p.version);process.exit(1)}"

      - name: Publish
        run: npm publish --access public
